<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Banner Livraison</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #111;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .ticker-wrap {
      width: 100%;
      background: #000;
      border-top: 1px solid #2a2a2a;
      border-bottom: 1px solid #2a2a2a;
      overflow: hidden;
      padding: 10px 0;
      position: relative;
    }

    .ticker-track {
      display: flex;
      animation: ticker 18s linear infinite;
      will-change: transform;
    }

    .ticker-track:hover {
      animation-play-state: paused;
    }

    .ticker-item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 0 60px;
      white-space: nowrap;
      font-family: 'Montserrat', sans-serif;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #fff;
      flex-shrink: 0;
    }

    .ticker-item .dot {
      width: 5px;
      height: 5px;
      background: #c9a96e;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .ticker-item .highlight {
      color: #c9a96e;
    }

    @keyframes ticker {
      0%   { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }
  </style>
</head>
<body>

  <div class="ticker-wrap">
    <div class="ticker-track" id="track"></div>
  </div>

  <script>
    const messages = [
      'Livraison offerte à partir de <span class="highlight">69 €</span>',
      'Paiement 3x sans frais avec Klarna',
      'Livraison offerte à partir de <span class="highlight">69 €</span>',
      'Retours gratuits sous 30 jours',
    ];

    const track = document.getElementById('track');

    // On double le contenu pour la boucle infinie
    // On répète assez de fois pour toujours remplir l'écran
    const repeat = 8;
    let html = '';
    for (let i = 0; i < repeat; i++) {
      messages.forEach(msg => {
        html += `<div class="ticker-item"><span class="dot"></span>${msg}</div>`;
      });
    }

    // Contenu doublé pour le translateX(-50%) seamless
    track.innerHTML = html + html;
  </script>

</body>
</html>
